[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bqdp"
version = "1.0.0"
description = "Universal integer-based recommendation system with online learning"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/pusheandoando/bqdp"

[tool.setuptools.packages.find]
where = ["."]
include = ["bqdp*"]
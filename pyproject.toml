[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bqdp"
version = "1.0.1"
description = "Universal integer-based sequential recommendation with online learning and conformal candidate sets"
requires-python = ">=3.12"
authors = [
    { name = "Christian (@pusheandoando)" },
]
dependencies = [
    "numpy==2.5.3"
]

[project.urls]
Homepage = "https://github.com/pusheandoando/bqdp"

[tool.setuptools.packages.find]
where = ["."]
include = ["bqdp*"]